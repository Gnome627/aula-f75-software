name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tools
        run: pip install pyinstaller -r requirements.txt

      - name: Build AULA-F75.exe
        run: >
          pyinstaller --noconfirm --onefile --noconsole --name AULA-F75 --icon icon.ico
          --add-data "ui.html;." --add-data "strings.json;." f75.py

      - name: Smoke test
        run: |
          $p = Start-Process dist\AULA-F75.exe -ArgumentList '--lang', 'en', 'modes' -Wait -PassThru
          exit $p.ExitCode

      - uses: actions/upload-artifact@v4
        with:
          name: AULA-F75-windows
          path: dist/AULA-F75.exe

  linux:
    runs-on: ubuntu-22.04   # an older system library, so the binary also starts on older distributions
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tools
        run: pip install pyinstaller

      - name: Build aula-f75
        run: >
          pyinstaller --noconfirm --onefile --name aula-f75
          --add-data "ui.html:." --add-data "strings.json:." f75.py

      - name: Smoke test
        run: dist/aula-f75 --lang en modes

      - name: Pack with the udev rule
        run: tar -czf aula-f75-linux-x86_64.tar.gz -C dist aula-f75 -C .. 60-aula-f75.rules README.md LICENSE

      - uses: actions/upload-artifact@v4
        with:
          name: AULA-F75-linux
          path: aula-f75-linux-x86_64.tar.gz

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" AULA-F75.exe aula-f75-linux-x86_64.tar.gz --generate-notes
